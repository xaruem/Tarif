<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маннапов Улугбек | Сайты, боты, дизайн</title>
    <meta name="description" content="Создание сайтов, Telegram-ботов и дизайнерских карточек для маркетплейсов. Цены на услуги.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
    <script src="https://unpkg.com/lenis@1.3.17/dist/lenis.min.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="preloader" aria-hidden="true">
        <svg class="preloader-svg" viewBox="0 0 100 100"><circle class="preloader-circle" cx="50" cy="50" r="40"></circle></svg>
    </div>
    <div class="cursor" aria-hidden="true"></div>
    <div class="cursor-follower" aria-hidden="true"></div>
    <div class="scroll-progress" aria-hidden="true"></div>

    <header class="header">
        <a href="#home" class="logo" aria-label="Маннапов Улугбек">UM</a>
        <div class="header-right">
            <a class="header-tg" href="https://t.me/WebFlow_siteuz" target="_blank" rel="noopener" aria-label="Telegram @WebFlow_siteuz">
                <i class="fab fa-telegram"></i>
            </a>
            <div class="lang" role="group" aria-label="Language">
                <span class="lang-thumb"></span>
                <button type="button" class="lang-btn" data-lang="ru" aria-pressed="true">RU</button>
                <button type="button" class="lang-btn" data-lang="uz" aria-pressed="false">UZ</button>
            </div>
        </div>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-glow" aria-hidden="true"></div>
            <div class="hero-content">
                <p class="hero-subtitle" data-i18n="hero_sub"></p>
                <h1 class="hero-title" id="hero-title" aria-label="Маннапов Улугбек"></h1>
                <div class="hero-cta">
                    <a href="#prices" class="btn btn-primary"><span data-i18n="cta_prices"></span> <i class="fas fa-arrow-down"></i></a>
                    <a href="https://t.me/WebFlow_siteuz" target="_blank" rel="noopener" class="btn btn-secondary"><i class="fab fa-telegram"></i> <span data-i18n="cta_projects"></span></a>
                </div>
            </div>
            <a href="#prices" class="scroll-down" aria-label="Scroll"><span class="mouse"><span class="wheel"></span></span></a>
        </section>

        <section id="prices" class="prices">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" data-i18n="prices_title"></h2>
                    <div class="section-line"></div>
                </div>

                <article class="group">
                    <header class="group-head">
                        <span class="group-icon"><i class="fas fa-globe"></i></span>
                        <h3 data-i18n="g_sites"></h3>
                    </header>
                    <ul class="rows">
                        <li class="row" data-from="500000" data-to="1500000"><span class="row-name" data-i18n="s_landing"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="2000000"><span class="row-name" data-i18n="s_corp"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="4000000"><span class="row-name" data-i18n="s_shop"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="5000000"><span class="row-name" data-i18n="s_custom"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                    </ul>
                    <p class="group-sub" data-i18n="extra"></p>
                    <ul class="rows rows-extra">
                        <li class="row" data-from="300000"><span class="row-name" data-i18n="s_domain"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="300000" data-unit="month"><span class="row-name" data-i18n="s_support"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                    </ul>
                </article>

                <article class="group">
                    <header class="group-head">
                        <span class="group-icon"><i class="fas fa-robot"></i></span>
                        <h3 data-i18n="g_bots"></h3>
                    </header>
                    <ul class="rows">
                        <li class="row" data-from="300000"><span class="row-name" data-i18n="b_simple"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="1000000"><span class="row-name" data-i18n="b_pay"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="3000000"><span class="row-name" data-i18n="b_biz"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                    </ul>
                </article>

                <article class="group">
                    <header class="group-head">
                        <span class="group-icon"><i class="fas fa-palette"></i></span>
                        <h3><span data-i18n="g_cards"></span> <small data-i18n="g_cards_sub"></small></h3>
                    </header>
                    <ul class="rows">
                        <li class="row" data-from="50000"><span class="row-name" data-i18n="c_1"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="200000"><span class="row-name" data-i18n="c_5"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row" data-from="300000"><span class="row-name" data-i18n="c_10"></span><span class="row-leader"></span><span class="row-price"></span><span class="row-line"></span></li>
                        <li class="row"><span class="row-name" data-i18n="c_full"></span><span class="row-leader"></span><span class="row-price" data-i18n="negotiable"></span><span class="row-line"></span></li>
                    </ul>
                </article>

                <ul class="terms">
                    <li><i class="fas fa-clock"></i><span data-i18n="t_time"></span></li>
                    <li><i class="fas fa-wallet"></i><span data-i18n="t_prepay"></span></li>
                    <li><i class="fas fa-calculator"></i><span data-i18n="t_custom"></span></li>
                </ul>

                <a class="channel" href="https://t.me/WebFlow_siteuz" target="_blank" rel="noopener">
                    <span class="channel-text">
                        <span class="channel-title" data-i18n="channel_title"></span>
                        <span class="channel-handle">@WebFlow_siteuz</span>
                    </span>
                    <span class="channel-icon"><i class="fab fa-telegram"></i></span>
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 <span id="footer-name">Маннапов Улугбек</span></p>
        <a href="https://t.me/WebFlow_siteuz" target="_blank" rel="noopener">@WebFlow_siteuz</a>
    </footer>
</body>
</html>
